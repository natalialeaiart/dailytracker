<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F2FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<title>Daily Tracker</title>
<style>
:root{
  --paper:#F4F2FA; --card:#FFFFFF; --ink:#241F3D; --muted:#6E6889;
  --line:#E8E4F5; --accent:#6B5FB5; --accent-soft:#D6D0F5;
  --done:#3FB8AE; --streak:#C9A961; --danger:#B5476B;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,"Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
a{color:var(--accent);text-decoration:none}

#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh}
.screen{padding:calc(20px + env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom))}
.screen.plain{padding-bottom:calc(32px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.muted{color:var(--muted)}
.small{font-size:13px}
h1{font-size:26px;font-weight:500;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:15px;font-weight:500;margin:26px 0 10px;color:var(--muted)}
p{margin:0 0 12px}

/* header of the day */
.dayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dayhead .title{font-size:22px;font-weight:500}
.arrows{display:flex;gap:4px}
.arrow{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted)}
.arrow:active{background:var(--accent-soft)}
.arrow[disabled]{opacity:.25;pointer-events:none}
.score{display:flex;align-items:baseline;gap:6px;margin:10px 0 4px}
.score .big{font-size:48px;font-weight:500;line-height:1;letter-spacing:-.02em}
.score .pct{font-size:18px;color:var(--muted)}
.score .of{margin-left:auto;font-size:14px;color:var(--muted)}
.score.full .big{color:var(--done)}

/* metric groups */
.group{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.row .name{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font-size:15px;color:var(--muted);white-space:nowrap}
.row.met .val{color:var(--done)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .25s ease}
.row.met .bar i{background:var(--done)}
.ctl{display:flex;align-items:center;gap:8px;margin-top:10px}
.ctl input[type=number]{width:84px;font-size:20px;font-weight:500;padding:6px 0;border-bottom:1px solid var(--line);text-align:left}
.ctl input[type=number]:focus{border-bottom-color:var(--accent)}
.ctl .unit{font-size:14px;color:var(--muted)}
.chip{margin-left:auto;height:36px;padding:0 14px;border-radius:18px;background:var(--paper);font-size:14px;color:var(--accent)}
.chip+.chip{margin-left:0}
.chip:active{background:var(--accent-soft)}
.note{width:100%;font-size:15px;padding:8px 0;border-bottom:1px solid var(--line);margin-top:8px}
.note:focus{border-bottom-color:var(--accent)}
textarea.note{resize:none;min-height:56px;border:0;background:var(--paper);border-radius:10px;padding:10px 12px;line-height:1.45}
.check{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:14px 16px;min-height:52px}
.check .name{font-size:16px}
.tick{width:26px;height:26px;border-radius:13px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.tick svg{width:14px;height:14px;opacity:0}
.row.met .tick{background:var(--done);border-color:var(--done)}
.row.met .tick svg{opacity:1}
.week{font-size:13px;color:var(--muted);margin-top:8px}
.week.met{color:var(--done)}

/* keypad */
.pinwrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.dots{display:flex;gap:18px;margin:28px 0 40px;height:14px}
.dot{width:14px;height:14px;border-radius:7px;border:1.5px solid var(--accent-soft)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}
.key{width:76px;height:76px;border-radius:38px;background:var(--card);font-size:28px;font-weight:400}
.key:active{background:var(--accent-soft)}
.key.ghost{background:none;font-size:15px;color:var(--muted)}
.linkbtn{color:var(--muted);font-size:14px;padding:14px;margin-top:26px}

/* buttons */
.btn{display:block;width:100%;height:52px;border-radius:26px;background:var(--ink);color:#fff;font-size:16px;font-weight:500}
.btn:active{opacity:.85}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent-soft)}
.btn+.btn{margin-top:10px}
.btnrow{margin-top:auto;padding-top:24px}

/* settings */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:15px 16px;min-height:54px;border-top:1px solid var(--line);gap:12px}
.item:first-child{border-top:0}
.item .sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--paper);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink)}
.about{padding:16px;line-height:1.5;font-size:15px}
.about p{margin:0 0 12px}
.about .name{font-weight:500}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .inner{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;height:58px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button.on{color:var(--ink)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* seven-day preview */
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}
.d7{text-align:center;font-size:12px;color:var(--muted)}
.d7 .col{height:64px;display:flex;align-items:flex-end;background:var(--card);border-radius:8px;overflow:hidden;margin-bottom:6px}
.d7 .col i{display:block;width:100%;background:var(--accent-soft)}
.d7.today .col i{background:var(--accent)}
.d7.full .col i{background:var(--done)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

/* ---------- storage ---------- */
function load(key, fallback){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

const state = {
  settings: load(KEYS.settings, null),
  metrics: load(KEYS.metrics, []),
  entries: load(KEYS.entries, {}),
  lang: 'en',
  date: null,
  view: 'today',
  unlocked: false,
  pin: { mode:null, buf:'', first:'', err:false }
};

function detectLang(){ return (navigator.language||'en').toLowerCase().startsWith('ru') ? 'ru' : 'en'; }
state.lang = (state.settings && state.settings.lang) || detectLang();
document.documentElement.lang = state.lang;

function t(k){ const s=STRINGS[state.lang]; return (k in s)?s[k]:STRINGS.en[k]||k; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- dates ---------- */
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayISO(){ return iso(new Date()); }
function shift(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function weekStart(s){ const d=parse(s); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); }
function fmtLong(s){ return new Intl.DateTimeFormat(t('dateLocale'),{weekday:'long',day:'numeric',month:'long'}).format(parse(s)); }
function fmtShort(s){ return new Intl.DateTimeFormat(t('dateLocale'),{day:'numeric',month:'long'}).format(parse(s)); }
function fmtWeekday(s){ return new Intl.DateTimeFormat(t('dateLocale'),{weekday:'short'}).format(parse(s)); }
state.date = todayISO();

/* ---------- seed metrics ---------- */
function seed(){
  const m=(id,name,type,unit,goal,goalPeriod,category,order)=>({id,name,emoji:'',type,unit,goal,goalPeriod,category,order,archived:false,createdAt:todayISO(),archivedAt:null});
  return [
    m('m_sport','Sport','minutes','min',30,'day','Health',1),
    m('m_selfcare','Self-care','minutes','min',20,'day','Health',2),
    m('m_steps','Steps','number','steps',8000,'day','Health',3),
    m('m_walk','Walk','check','',null,null,'Health',4),
    m('m_english','English','minutes','min',20,'day','Growth',5),
    m('m_lesson','Online lesson','minutes','min',60,'day','Growth',6),
    m('m_cv','CVs sent','number_note','',5,'week','Work',7),
    m('m_interview','Interview today','check','',null,null,'Work',8),
    m('m_ig','Instagram post','check','',null,null,'Content',9),
    m('m_tt','TikTok post','check','',null,null,'Content',10),
    m('m_yt','YouTube post','check','',null,null,'Content',11),
    m('m_ctime','Content time','minutes','min',null,null,'Content',12),
    m('m_notes','Notes','note','',null,null,'Other',13)
  ];
}

/* ---------- entries ---------- */
function getVal(id, date){ const day=state.entries[date]; return day?day[id]:undefined; }
function setVal(id, date, v){
  const day = state.entries[date] || (state.entries[date]={});
  const empty = v===undefined || v===null || v===false || v==='' || (typeof v==='number' && (isNaN(v)||v===0)) || (typeof v==='object' && !v.value && !v.note);
  if(empty) delete day[id]; else day[id]=v;
  if(Object.keys(day).length===0) delete state.entries[date];
  save(KEYS.entries, state.entries);
}
function numOf(v){ if(v==null) return 0; if(typeof v==='object') return Number(v.value)||0; if(typeof v==='boolean') return v?1:0; return Number(v)||0; }
function weekSum(id, date){ const ws=weekStart(date); let s=0; for(let i=0;i<7;i++) s+=numOf(getVal(id, shift(ws,i))); return s; }
function isMet(m, date){
  if(m.goal==null) return false;
  if(m.goalPeriod==='week') return weekSum(m.id,date)>=m.goal;
  return numOf(getVal(m.id,date))>=m.goal;
}
function active(){ return state.metrics.filter(x=>!x.archived).sort((a,b)=>a.order-b.order); }
function dayScore(date){
  const goals = active().filter(m=>m.goal!=null && m.goalPeriod==='day');
  if(goals.length){ const done=goals.filter(m=>isMet(m,date)).length; return {done,total:goals.length,pct:Math.round(done/goals.length*100)}; }
  const all=active().filter(m=>m.type!=='note'); const filled=all.filter(m=>getVal(m.id,date)!==undefined).length;
  return {done:filled,total:all.length,pct:all.length?Math.round(filled/all.length*100):0};
}

/* ---------- pin ---------- */
async function hashPin(pin, salt){
  if(window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pin));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h=5381; const s=salt+':'+pin; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return 'fb'+(h>>>0).toString(16);
}
function makeSalt(){ const a=new Uint8Array(16); (window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function savePin(pin){
  const salt=makeSalt(); const pinHash=await hashPin(pin,salt);
  state.settings = Object.assign({createdAt:todayISO(),lastBackupAt:null,weekStart:1,onboarded:true,lang:state.lang}, state.settings||{}, {pinHash,salt});
  save(KEYS.settings, state.settings);
}
async function checkPin(pin){ return (await hashPin(pin,state.settings.salt))===state.settings.pinHash; }

/* ---------- ui helpers ---------- */
const app=document.getElementById('app');
let toastTimer;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),1800); }
function vibrate(ms){ if(navigator.vibrate) navigator.vibrate(ms); }
const ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>';

/* ---------- render ---------- */
function render(){
  const m=state.pin.mode;
  if(!state.settings || !state.settings.pinHash){ hideNav(); return m==='set'||m==='confirm'?renderPin(m):renderWelcome(); }
  if(m==='forgot'){ hideNav(); return renderForgot(); }
  if(m && m!=='unlock'){ hideNav(); return renderPin(m); }
  if(!state.unlocked){ hideNav(); return renderPin('unlock'); }
  if(state.view==='stats') renderStats();
  else if(state.view==='settings') renderSettings();
  else renderToday();
  renderNav();
}

function pinTitle(mode){
  return {set:t('setPin'),confirm:t('confirmPin'),unlock:t('enterPin'),'change-old':t('oldPin'),'change-new':t('newPin'),'change-confirm':t('confirmPin')}[mode];
}
function renderPin(mode){
  state.pin.mode=mode;
  const p=state.pin;
  const dots=[0,1,2,3].map(i=>`<span class="dot ${i<p.buf.length?'on':''}"></span>`).join('');
  const keys=['1','2','3','4','5','6','7','8','9','',
    '0','\u232b'];
  const showForgot = mode==='unlock';
  const showCancel = mode.startsWith('change');
  app.innerHTML = `
  <div class="screen plain">
    <div class="pinwrap">
      <div style="font-size:18px;font-weight:500">${esc(pinTitle(mode))}</div>
      <div class="small" style="min-height:20px;margin-top:6px;color:${p.err?'var(--danger)':'var(--muted)'}">${p.err?esc(p.err):''}</div>
      <div class="dots ${p.shake?'shake':''}" id="dots">${dots}</div>
      <div class="pad">${keys.map(k=>k===''?'<span></span>':`<button class="key ${k==='\u232b'?'ghost':''}" data-k="${k}" aria-label="${k==='\u232b'?'delete':k}">${k}</button>`).join('')}</div>
      ${showForgot?`<button class="linkbtn" id="forgotBtn">${esc(t('forgot'))}</button>`:''}
      ${showCancel?`<button class="linkbtn" id="cancelBtn">${esc(t('cancel'))}</button>`:''}
    </div>
  </div>`;
  p.shake=false;
  app.querySelectorAll('.key').forEach(b=>b.onclick=()=>onKey(b.dataset.k));
  const fb=document.getElementById('forgotBtn'); if(fb) fb.onclick=()=>{ state.pin={mode:'forgot',buf:'',first:'',err:false}; render(); };
  const cb=document.getElementById('cancelBtn'); if(cb) cb.onclick=()=>{ state.pin={mode:null,buf:'',first:'',err:false}; render(); };
}
async function onKey(k){
  const p=state.pin;
  if(k==='\u232b'){ p.buf=p.buf.slice(0,-1); p.err=false; return renderPin(p.mode); }
  if(p.buf.length>=4) return;
  p.buf+=k; p.err=false; renderPin(p.mode);
  if(p.buf.length<4) return;
  const pin=p.buf;
  await new Promise(r=>setTimeout(r,120));
  if(p.mode==='set'||p.mode==='change-new'){ p.first=pin; p.buf=''; return renderPin(p.mode==='set'?'confirm':'change-confirm'); }
  if(p.mode==='confirm'||p.mode==='change-confirm'){
    if(pin!==p.first){ p.buf=''; p.first=''; p.err=t('pinMismatch'); p.shake=true; vibrate(60); return renderPin(p.mode==='confirm'?'set':'change-new'); }
    await savePin(pin);
    if(state.metrics.length===0){ state.metrics=seed(); save(KEYS.metrics,state.metrics); }
    const was=p.mode; state.pin={mode:null,buf:'',first:'',err:false}; state.unlocked=true;
    if(was==='change-confirm') toast(t('pinChanged'));
    return render();
  }
  if(p.mode==='unlock'||p.mode==='change-old'){
    const ok=await checkPin(pin);
    if(!ok){ p.buf=''; p.err=t('wrongPin'); p.shake=true; vibrate(60); return renderPin(p.mode); }
    if(p.mode==='unlock'){ state.unlocked=true; state.pin={mode:null,buf:'',first:'',err:false}; return render(); }
    p.buf=''; return renderPin('change-new');
  }
}
function renderForgot(){
  app.innerHTML=`
  <div class="screen plain">

    </div>
  </div>`;
  document.getElementById('bkBtn').onclick=exportBackup;
  document.getElementById('rsBtn').onclick=()=>{ state.pin={mode:'set',buf:'',first:'',err:false}; renderPin('set'); };
  document.getElementById('backBtn').onclick=()=>{ state.pin={mode:'unlock',buf:'',first:'',err:false}; render(); };
}

/* ---------- today ---------- */
function renderToday(){
  const d=state.date, today=todayISO();
  const title = d===today?t('today'):(d===shift(today,-1)?t('yesterday'):fmtWeekday(d));
  const groups = CATS.map(c=>({c,items:active().filter(m=>m.category===c)})).filter(g=>g.items.length);
  app.innerHTML=`
  <div class="screen" id="todayScreen">
    <div class="dayhead">
      <div>
        <div class="title">${esc(title)}</div>
        <div class="small muted">${esc(fmtLong(d))}</div>
      </div>
      <div class="arrows">
        <button class="arrow" id="prevBtn" aria-label="previous day">\u2039</button>
        <button class="arrow" id="nextBtn" aria-label="next day" ${d>=today?'disabled':''}>\u203a</button>
      </div>
    </div>
    <div class="score" id="score"></div>
    ${groups.map(g=>`<h2>${esc(t('cat')[g.c]||g.c)}</h2><div class="group">${g.items.map(rowHTML).join('')}</div>`).join('')}
  </div>`;
  refreshScore();
  document.getElementById('prevBtn').onclick=()=>{ state.date=shift(state.date,-1); renderToday(); };
  document.getElementById('nextBtn').onclick=()=>{ if(state.date<today){ state.date=shift(state.date,1); renderToday(); } };
  bindRows();
  swipe(document.getElementById('todayScreen'));
}

function rowHTML(m){
  const v=getVal(m.id,state.date); const met=isMet(m,state.date);
  if(m.type==='check'){
    return `<div class="row ${met||v===true?'met':''}" data-id="${m.id}" style="padding:0"><button class="check" data-toggle="${m.id}"><span class="name">${esc(m.name)}</span><span class="tick">${ICON_CHECK}</span></button></div>`;
  }
  if(m.type==='note'){
    return `<div class="row" data-id="${m.id}"><textarea class="note" data-note="${m.id}" rows="2" placeholder="${esc(t('notePh'))}">${esc(v||'')}</textarea></div>`;
  }
  const num = typeof v==='object'&&v?v.value:v;
  const unit = m.unit==='min'?t('min'):m.unit;
  const weekly = m.goalPeriod==='week';
  return `<div class="row ${met?'met':''}" data-id="${m.id}">
    <div class="top"><span class="name">${esc(m.name)}</span><span class="val" data-val="${m.id}">${valText(m)}</span></div>
    ${m.goal!=null&&!weekly?`<div class="bar"><i data-bar="${m.id}"></i></div>`:''}
    <div class="ctl">
      <input type="number" inputmode="numeric" pattern="[0-9]*" min="0" data-num="${m.id}" value="${num||''}" placeholder="0" aria-label="${esc(m.name)}">
      ${unit?`<span class="unit">${esc(unit)}</span>`:''}
      ${m.type==='minutes'?`<button class="chip" data-add="15" data-for="${m.id}">+15</button><button class="chip" data-add="30" data-for="${m.id}">+30</button>`:''}
    </div>
    ${m.type==='number_note'?`<input class="note" type="text" data-text="${m.id}" value="${esc(typeof v==='object'&&v?v.note||'':'')}" placeholder="${esc(t('where'))}">`:''}
    ${weekly?`<div class="week ${met?'met':''}" data-week="${m.id}">${weekText(m)}</div>`:''}
  </div>`;
}
function valText(m){
  const n=numOf(getVal(m.id,state.date)); const unit=m.unit==='min'?t('min'):m.unit;
  if(m.goal!=null && m.goalPeriod==='day') return `${n} / ${m.goal}${unit?' '+esc(unit):''}`;
  return n?`${n}${unit?' '+esc(unit):''}`:'';
}
function weekText(m){ return `${weekSum(m.id,state.date)} / ${m.goal} ${esc(t('thisWeek'))}`; }

function bindRows(){
  app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.toggle; const cur=getVal(id,state.date)===true; setVal(id,state.date,!cur); refreshRow(id); vibrate(10);
  });
  app.querySelectorAll('[data-num]').forEach(inp=>inp.oninput=()=>{
    const id=inp.dataset.num; const m=state.metrics.find(x=>x.id===id); const n=Math.max(0,Math.round(Number(inp.value)||0));
    if(m.type==='number_note'){ const cur=getVal(id,state.date)||{}; setVal(id,state.date,{value:n,note:(typeof cur==='object'&&cur.note)||''}); }
    else setVal(id,state.date,n);
    refreshRow(id);
  });
  app.querySelectorAll('[data-text]').forEach(inp=>inp.oninput=()=>{
    const id=inp.dataset.text; const cur=getVal(id,state.date)||{}; setVal(id,state.date,{value:(typeof cur==='object'&&cur.value)||0,note:inp.value.trim()});
  });
  app.querySelectorAll('[data-note]').forEach(ta=>ta.oninput=()=>setVal(ta.dataset.note,state.date,ta.value));
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.for; const n=numOf(getVal(id,state.date))+Number(b.dataset.add); setVal(id,state.date,n);
    const inp=app.querySelector(`[data-num="${id}"]`); if(inp) inp.value=n; refreshRow(id); vibrate(10);
  });
}
function refreshRow(id){
  const m=state.metrics.find(x=>x.id===id); const row=app.querySelector(`.row[data-id="${id}"]`); if(!row) return;
  const met=isMet(m,state.date) || (m.type==='check'&&getVal(id,state.date)===true);
  row.classList.toggle('met',met);
  const val=row.querySelector('[data-val]'); if(val) val.innerHTML=valText(m);
  const bar=row.querySelector('[data-bar]'); if(bar) bar.style.width=Math.min(100,Math.round(numOf(getVal(id,state.date))/m.goal*100))+'%';
  const wk=row.querySelector('[data-week]'); if(wk){ wk.innerHTML=weekText(m); wk.classList.toggle('met',met); }
  refreshScore();
}
function refreshScore(){
  const s=dayScore(state.date); const el=document.getElementById('score'); if(!el) return;
  el.className='score'+(s.total&&s.done===s.total?' full':'');
  el.innerHTML=`<span class="big">${s.pct}</span><span class="pct">%</span><span class="of">${s.done} ${esc(t('of'))} ${s.total}</span>`;
  app.querySelectorAll('[data-bar]').forEach(b=>{ const m=state.metrics.find(x=>x.id===b.dataset.bar); b.style.width=Math.min(100,Math.round(numOf(getVal(m.id,state.date))/m.goal*100))+'%'; });
}
function swipe(el){
  let x0=null,y0=null;
  el.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)) return;
    if(dx<0 && state.date<todayISO()){ state.date=shift(state.date,1); renderToday(); }
    if(dx>0){ state.date=shift(state.date,-1); renderToday(); }
  },{passive:true});
}

/* ---------- stats (preview) ---------- */
function renderStats(){
  const today=todayISO(); const days=[]; for(let i=6;i>=0;i--) days.push(shift(today,-i));
  app.innerHTML=`
  <div class="screen">
    <h1>${esc(t('statsTitle'))}</h1>
    <p class="muted">${esc(t('statsSoon'))}</p>
    <div class="days7">${days.map(d=>{ const s=dayScore(d); return `<div class="d7 ${d===today?'today':''} ${s.total&&s.done===s.total?'full':''}"><div class="col"><i style="height:${Math.max(s.pct,s.pct?4:0)}%"></i></div>${esc(fmtWeekday(d))}<div>${s.pct}%</div></div>`; }).join('')}</div>
  </div>`;
}

/* ---------- settings ---------- */
function renderSettings(){
  const lastB = state.settings.lastBackupAt;
  app.innerHTML=`
  <div class="screen">
    <h1>${esc(t('settings'))}</h1>
    <div class="list" style="margin-top:20px">
      <div class="item"><span>${esc(t('language'))}</span>
        <div class="seg"><button class="${state.lang==='en'?'on':''}" data-lang="en">EN</button><button class="${state.lang==='ru'?'on':''}" data-lang="ru">RU</button></div></div>
      <button class="item" id="chPin"><span>${esc(t('changePin'))}</span><span class="muted">\u203a</span></button>
    </div>
    <div class="list" style="margin-top:14px">
      <button class="item" id="bkBtn"><span>${esc(t('backupTitle'))}<span class="sub">${esc(t('backupSub'))}${lastB?' \u00b7 '+esc(fmtShort(lastB)):''}</span></span><span class="muted">\u203a</span></button>
      <button class="item" id="rsBtn"><span>${esc(t('restore'))}<span class="sub">${esc(t('restoreSub'))}</span></span><span class="muted">\u203a</span></button>
      <input type="file" id="rsFile" accept="application/json,.json" style="display:none">
    </div>
    <h2>${esc(t('about'))}</h2>
    <div class="list about">
      <p>${esc(t('aboutText'))}</p>
      <p class="muted">${esc(t('privacy'))}</p>
      <p class="muted">${esc(t('goodToKnow'))}</p>
      <p><span class="name">${esc(t('madeBy'))} Natalia Le</span><br>
        <a href="https://t.me/AI_Test_Tube" target="_blank" rel="noopener noreferrer">Telegram \u2014 AI Test Tube</a><br>
        <a href="https://www.instagram.com/nataliale_aiart" target="_blank" rel="noopener noreferrer">Instagram \u2014 @nataliale_aiart</a></p>
      <p class="muted small" style="margin:0">${esc(t('version'))} ${APP_VERSION}</p>
    </div>
  </div>`;
  app.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ setLang(b.dataset.lang); render(); });
  document.getElementById('chPin').onclick=()=>{ state.pin={mode:'change-old',buf:'',first:'',err:false}; render(); };
  document.getElementById('bkBtn').onclick=exportBackup;
  const file=document.getElementById('rsFile');
  document.getElementById('rsBtn').onclick=()=>file.click();
  file.onchange=()=>importBackup(file.files[0]);
}
function setLang(l){ state.lang=l; document.documentElement.lang=l; if(state.settings){ state.settings.lang=l; save(KEYS.settings,state.settings); } }

/* ---------- backup ---------- */
function exportBackup(){
  const data={app:'daily-tracker',version:1,exportedAt:new Date().toISOString(),settings:state.settings,metrics:state.metrics,entries:state.entries};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`tracker-backup-${todayISO()}.json`; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  if(state.settings){ state.settings.lastBackupAt=todayISO(); save(KEYS.settings,state.settings); if(state.view==='settings'&&state.unlocked) renderSettings(); }
}
function importBackup(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    let data; try{ data=JSON.parse(r.result); }catch(e){ return toast(t('restoreBad')); }
    if(!data||data.app!=='daily-tracker'||!Array.isArray(data.metrics)||typeof data.entries!=='object') return toast(t('restoreBad'));
    if(!confirm(t('restoreConfirm'))) return;
    state.metrics=data.metrics; state.entries=data.entries||{};
    state.settings=Object.assign({}, data.settings||{}, {pinHash:state.settings.pinHash, salt:state.settings.salt, lang:state.lang});
    save(KEYS.metrics,state.metrics); save(KEYS.entries,state.entries); save(KEYS.settings,state.settings);
    toast(t('restoreDone')); state.view='today'; render();
  };
  r.readAsText(file);
}

  stats:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',

};
function renderNav(){
  let nav=document.querySelector('nav');
  if(!nav){ nav=document.createElement('nav'); document.body.appendChild(nav); }
  nav.innerHTML=`<div class="inner">
    <button class="${state.view==='today'?'on':''}" data-view="today">${ICONS.today}${esc(t('navToday'))}</button>
    <button class="${state.view==='stats'?'on':''}" data-view="stats">${ICONS.stats}${esc(t('navStats'))}</button>
    <button class="${state.view==='settings'?'on':''}" data-view="settings">${ICONS.settings}${esc(t('navSettings'))}</button>
  </div>`;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.view=b.dataset.view; if(state.view==='today') state.date=todayISO(); render(); window.scrollTo(0,0); });
}
function hideNav(){ const n=document.querySelector('nav'); if(n) n.remove(); }

/* lock again when the app goes to background for a while */
let hiddenAt=null;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(hiddenAt && Date.now()-hiddenAt>5*60*1000 && state.unlocked){ state.unlocked=false; state.pin={mode:'unlock',buf:'',first:'',err:false}; render(); }
  hiddenAt=null;
});

render();
</script>
